<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pocket Park</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="Game status">
        <div>
          <p class="eyebrow">Pocket Park</p>
          <h1 id="level-title">Loading</h1>
        </div>
        <div class="stats">
          <span id="timer">00:00.0</span>
          <span id="status">Reach the exit together</span>
        </div>
        <div class="actions" aria-label="Game options">
          <button id="players-button" type="button">2 Pips</button>
          <button id="motion-button" type="button">Motion On</button>
          <button id="mute-button" type="button">Sound On</button>
        </div>
      </section>

      <section class="stage-wrap" aria-label="Pocket Park game">
        <canvas id="game" width="960" height="540" aria-label="Pocket Park arcade stage"></canvas>
      </section>

      <section class="controls" aria-label="Controls reference">
        <div><strong>Pip Star</strong> <span>WASD</span></div>
        <div><strong>Pip Moon</strong> <span>Arrow keys</span></div>
        <div><strong>Pip Bolt</strong> <span>I J L</span></div>
        <div><strong>Pip Heart</strong> <span>Numpad 8 4 6</span></div>
        <div><strong>Stages</strong> <span>1-6</span></div>
        <div><strong>Restart / Next</strong> <span>R / N</span></div>
        <div><strong>Options</strong> <span>P / M / V</span></div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
